name: Release

on:
  push:
    tags: ["v*"]

# Only the publishing job may write; every verification job only reads.
permissions:
  contents: read

jobs:
  # The browser tests of the dialogs, exactly as in CI.
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the controls and holiday dialogs
        run: npm test
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Recorder fixtures need unittest.mock's deferred-annotation fix.
          python-version: "3.14.7"
          cache: pip
      - name: Install Home Assistant test dependencies
        run: |
          python -m pip install -e ".[test]"
          python - <<'PY'
          import importlib.resources
          import json
          import subprocess
          import sys
          # Native service descriptions import these HA base components.
          requirements = set()
          for component in ("frontend", "conversation", "camera", "tts", "ffmpeg", "assist_pipeline"):
              manifest = importlib.resources.files("homeassistant").joinpath("components", component, "manifest.json")
              requirements.update(json.loads(manifest.read_text()).get("requirements", []))
          subprocess.check_call([sys.executable, "-m", "pip", "install", *sorted(requirements)])
          PY
      - name: Test the dialogs in the Home Assistant frontend
        run: >-
          pytest --no-cov
          tests/frontend/ha_dialog.py
          tests/frontend/ha_water_heater.py
          tests/frontend/ha_rrc_water_heater.py
          tests/frontend/ha_local_setup.py
          tests/frontend/ha_local_first.py
          tests/frontend/ha_rescan.py
          tests/frontend/ha_rrc_zone.py
          tests/frontend/ha_rrc_events.py

  # The same older Home Assistant versions as CI must pass before publishing.
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
          cache: pip
      - name: Install Home Assistant 2026.9.2 test environment
        run: >-
          python -m pip install
          pytest-homeassistant-custom-component==0.13.365
          hypothesis==6.170.14 aiomqtt==2.5.1
      - name: Run the full suite on Home Assistant 2026.9.2
        run: pytest

  minimum-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
          cache: pip
      - name: Install Home Assistant 2026.5.4 test environment
        run: >-
          python -m pip install
          pytest-homeassistant-custom-component==0.13.333
          hypothesis==6.170.14 aiomqtt==2.5.1
      - name: Run the full suite on the minimum supported Home Assistant
        run: pytest

  verify:
    # Keep the pinned Python version on a supported runner image.
    needs: [frontend, compatibility, minimum-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.2"
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify source quality
        run: |
          ruff format --check .
          ruff check .
          mypy
          pytest
      - name: Audit Python dependencies
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install -e ".[security]"
          .audit-venv/bin/python -m pip freeze --exclude-editable > .audit-venv/requirements.txt
          .audit-venv/bin/python -m pip_audit --strict --requirement .audit-venv/requirements.txt
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
      - name: Validate HACS repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  release:
    # Builds the archive again from the verified tag and publishes it.
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.2"
      - name: Build release files
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python scripts/build_release.py --expected-version "${RELEASE_VERSION#v}"
          python scripts/release_notes.py \
            --version "${RELEASE_VERSION#v}" \
            --output dist/release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/bosch_buderus_heating.zip \
              dist/bosch_buderus_heating.zip.sha256 \
              --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Bosch/Buderus Home Comfort ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md \
              "${release_flags[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/bosch_buderus_heating.zip \
              dist/bosch_buderus_heating.zip.sha256 \
              --title "Bosch/Buderus Home Comfort ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md \
              "${release_flags[@]}"
          fi
